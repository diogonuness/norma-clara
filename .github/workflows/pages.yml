# Publica o Norma Clara no GitHub Pages a cada push na main.
# Antes de publicar, roda as perguntas-gabarito: se alguma falhar,
# node testes.js sai com código 1 e nada é publicado.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Perguntas-gabarito e integridade da base (precisa dar 54/54)
        run: node testes.js

      - uses: actions/configure-pages@v5

      - name: Empacota o site (a raiz do repositório, sem build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publica
        id: publicacao
        uses: actions/deploy-pages@v4
